name: Post Vertical Wallpapers

on:
  schedule:
    # 3 раза в день: 10:00, 18:00, 02:00 по Москве (07:00, 15:00, 23:00 UTC)
    - cron: '0 7,15,23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post-wallpapers:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: python main.py
      
      - name: Commit posted.json updates
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add posted.json
          git commit -m "💾 Update posted wallpapers [skip ci]" || echo "No changes"
          git push
