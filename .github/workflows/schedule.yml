name: Post Vertical Wallpapers

on:
  schedule:
    # 6 раз в день по Москве: 09:00, 12:00, 15:00, 18:00, 21:00, 00:00
    # GitHub использует UTC (МСК = UTC+3), поэтому часы сдвинуты на -3
    - cron: '0 6,9,12,15,18,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post-wallpapers:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: python main.py
      
      - name: Commit posted.json updates
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add posted.json
          git commit -m "💾 Update posted wallpapers [skip ci]" || echo "No changes"
          git push
